domain: webshop
nfe: 1
run:
  seed: 42
models:
  backbone: Qwen/Qwen3-8B
  trust_remote_code: true
  agent_backend: vllm
  agent_enable_thinking: true
  agent_requires_native_thinking: true
  fail_on_prompt_truncation: true
  agent_max_input_tokens: 16384
  agent_vllm_dtype: bfloat16
  agent_vllm_tensor_parallel_size: 1
  agent_vllm_max_model_len: 24576
  agent_vllm_gpu_memory_utilization: 0.9
  agent_vllm_attention_backend: FLASH_ATTN
  agent_vllm_flash_attn_version: 2
  agent_vllm_request_batch_size: 8
  agent_vllm_max_num_seqs: 8
  agent_vllm_max_num_batched_tokens: 32768
  agent_vllm_enable_chunked_prefill: true
  agent_vllm_enable_prefix_caching: true
  agent_vllm_enforce_eager: false
sampling:
  max_steps: 30
  max_new_tokens: 4096
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
env:
  history_length: 4
  history_observation_chars: 1800
rollout:
  env_batch_size: 8
  llm_batch_size: 8
benchmark:
  name: webshop
  skill_conditioning:
    profile: webshop_grounded_memory
environment:
  bridge_url: http://127.0.0.1:8040
  timeout_seconds: 600
