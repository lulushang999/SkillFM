[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillflow-main"
version = "0.1.0"
description = "Classic skill Codec and improved MeanFlow, NFE=1"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4", "transformers>=4.57", "accelerate>=1.2",
  "numpy>=1.26", "PyYAML>=6.0", "safetensors>=0.4", "sentencepiece>=0.2"
]

[project.optional-dependencies]
inference = ["vllm>=0.24", "flash-attn>=2.7"]
alfworld = ["alfworld>=0.4.2", "spacy==3.7.5", "thinc==8.2.5"]
retrieval = ["fastapi>=0.115", "uvicorn>=0.30", "datasets>=2.20"]

[tool.setuptools.packages.find]
include = ["skillflow*"]
